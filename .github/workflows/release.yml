name: Release

on:
  push:
    # GitHub tag filters are globs; the exact four-integer format is checked below.
    tags:
      - '*.*.*.*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and primary-branch ancestry
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "A release tag must have the x.x.x.x format; received: $TAG" >&2
            exit 1
          fi

          git fetch --force origin master:refs/remotes/origin/master refs/tags/*:refs/tags/*
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/master; then
            echo "Tag $TAG does not point to a commit contained in master." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  publish-url-handler:
    name: Publish UrlHandler AOT executable
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Check NativeAOT MSVC toolchain
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw 'NativeAOT requires Visual Studio 2022 or later with the Desktop development with C++ workload.'
          }
          $installation = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($installation)) {
            throw 'NativeAOT requires the Visual Studio C++ x64/x86 build tools.'
          }

      - name: Publish UrlHandler for win-x64
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.tag }}
        run: |
          dotnet publish IslandCaller.UrlHandler/IslandCaller.UrlHandler.csproj `
            --configuration Release --runtime win-x64 --self-contained true --nologo `
            -p:PublishAot=true "-p:Version=$env:RELEASE_VERSION" `
            --output artifacts/urlhandler
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to publish IslandCaller.UrlHandler for win-x64.'
          }

          $executable = 'artifacts/urlhandler/IslandCaller.UrlHandler.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "AOT-published UrlHandler executable not found: $executable"
          }
          if ((Get-Item -LiteralPath $executable).Length -eq 0) {
            throw "AOT-published UrlHandler executable is empty: $executable"
          }

      - name: Upload UrlHandler executable
        uses: actions/upload-artifact@v4
        with:
          name: urlhandler-aot
          if-no-files-found: error
          path: artifacts/urlhandler/IslandCaller.UrlHandler.exe

  build:
    name: Build release artifact
    needs:
      - validate
      - publish-url-handler
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4

      - name: Download UrlHandler executable
        uses: actions/download-artifact@v4
        with:
          name: urlhandler-aot
          path: artifacts/urlhandler

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Restore dependencies
        run: dotnet restore IslandCaller.slnx -p:EnableWindowsTargeting=true

      - name: Build plugin and package cipx
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_VERSION"
          sed -i -E "s/^version: .*/version: ${TAG}/" IslandCaller.Plugin2/manifest.yml
          grep -Fx "version: ${TAG}" IslandCaller.Plugin2/manifest.yml
          dotnet build IslandCaller.Plugin2/IslandCaller.Plugin2.csproj \
            --configuration Release --no-restore --nologo \
            -p:EnableWindowsTargeting=true -p:Version="${TAG}"

          PLUGIN_OUTPUT="IslandCaller.Plugin2/bin/Release/net10.0-windows10.0.19041.0"
          if [[ ! -d "$PLUGIN_OUTPUT" ]]; then
            echo "Expected plugin build output was not generated: $PLUGIN_OUTPUT" >&2
            exit 1
          fi

          mkdir -p artifacts/plugin
          find "$PLUGIN_OUTPUT" -maxdepth 1 -type f ! -name '*.pdb' -exec cp {} artifacts/plugin/ \;
          cp artifacts/urlhandler/IslandCaller.UrlHandler.exe artifacts/plugin/IslandCaller.UrlHandler.exe
          if [[ ! -s artifacts/plugin/IslandCaller.UrlHandler.exe ]]; then
            echo "AOT UrlHandler executable is missing or empty." >&2
            exit 1
          fi
          if [[ -z "$(find artifacts/plugin -maxdepth 1 -type f -print -quit)" ]]; then
            echo "Plugin package source is empty." >&2
            exit 1
          fi
          (
            cd artifacts/plugin
            zip -r ../IslandCaller.Plugin2.cipx .
          )
          if ! unzip -Z1 artifacts/IslandCaller.Plugin2.cipx | grep -Fxq 'IslandCaller.UrlHandler.exe'; then
            echo "IslandCaller.UrlHandler.exe is missing from the cipx archive root." >&2
            exit 1
          fi

      - name: Create checksums and release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_VERSION"
          CIPX_FILE="IslandCaller.Plugin2.cipx"
          CIPX_MD5="$(md5sum "artifacts/${CIPX_FILE}" | awk '{print $1}')"

          mkdir -p artifacts
          if [[ -f "docs/CHANGELOG/${TAG}.md" ]]; then
            cp "docs/CHANGELOG/${TAG}.md" artifacts/release-notes.md
          else
            printf '# IslandCaller %s\n\nArtifact MD5: `%s`\n' "$TAG" "$CIPX_MD5" > artifacts/release-notes.md
          fi
          sed -i "s/<CIPX_MD5>/${CIPX_MD5}/g" artifacts/release-notes.md

          jq -n \
            --arg tag "$TAG" \
            --arg cipx_package "$CIPX_FILE" \
            '{tag: $tag, cipx_package: $cipx_package}' \
            > artifacts/release-metadata.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          if-no-files-found: error
          path: |
            artifacts/IslandCaller.Plugin2.cipx
            artifacts/release-notes.md
            artifacts/release-metadata.json

  publish:
    name: Approve and publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: release
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(jq -r '.tag' artifacts/release-metadata.json)"
          CIPX_PACKAGE="$(jq -r '.cipx_package' artifacts/release-metadata.json)"
          REPOSITORY="$GITHUB_REPOSITORY"

          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPOSITORY" --title "$TAG" --notes-file artifacts/release-notes.md
            gh release upload "$TAG" --repo "$REPOSITORY" "artifacts/${CIPX_PACKAGE}" --clobber
          else
            gh release create "$TAG" \
              --repo "$REPOSITORY" \
              "artifacts/${CIPX_PACKAGE}" \
              --title "$TAG" \
              --notes-file artifacts/release-notes.md
          fi
